name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Qualidade, testes unitários e integração
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      NODE_ENV: test
      COMPOSE_PROJECT_NAME: oto-ci
      POSTGRES_DB: oto_ci_test
      POSTGRES_PORT: 55432
      DATABASE_URL: postgresql://app:app@localhost:55432/oto_ci_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar pnpm do packageManager
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Configurar Node e cache pnpm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Preparar pasta dos relatórios de teste
        run: mkdir -p reports

      - name: Conferir documentos, skill e planilhas
        run: pnpm validate:repo

      - name: Testar receptor de deploy isoladamente
        run: python3 deploy/test_ci_receiver.py

      - name: Conferir formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Validar schema Prisma
        run: pnpm db:validate

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Testes unitários dos contratos compartilhados
        env:
          NODE_TEST_FLAGS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=${{ github.workspace }}/reports/common-unit.xml --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=${{ github.workspace }}/reports/common-unit.lcov
        run: pnpm --filter @ssc0536/common test:unit

      - name: Testes unitários do backend
        env:
          NODE_TEST_FLAGS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=${{ github.workspace }}/reports/backend-unit.xml --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=${{ github.workspace }}/reports/backend-unit.lcov
          TSX_TEST_FLAGS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=${{ github.workspace }}/reports/backend-fixtures.xml
        run: pnpm --filter @ssc0536/backend test:unit

      - name: Testes unitários do frontend
        run: >-
          pnpm --filter @ssc0536/frontend test:unit --coverage
          --reporter=default --reporter=junit
          --outputFile.junit=${{ github.workspace }}/reports/frontend-unit.xml

      - name: Build do backend e frontend
        run: pnpm build

      - name: Iniciar PostgreSQL com PostGIS isolado
        run: pnpm db:up

      - name: Aplicar migrations
        run: pnpm db:deploy

      - name: Testes de integração e carga fictícia
        env:
          DATABASE_TEST_URL: postgresql://app:app@localhost:55432/oto_ci_test
          NODE_TEST_FLAGS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=${{ github.workspace }}/reports/backend-integration.xml --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=${{ github.workspace }}/reports/backend-integration.lcov
          TSX_TEST_FLAGS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=${{ github.workspace }}/reports/backend-integration-fixtures.xml
        run: pnpm test:integration

      - name: Verificar ausência de drift
        run: pnpm --filter @ssc0536/backend exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Resumo dos testes e da cobertura
        if: always()
        run: node scripts/test-summary.mjs | tee reports/resumo.md >> "$GITHUB_STEP_SUMMARY"

      # Só em PRs do próprio repositório: em forks o token é somente leitura.
      - name: Comentar resumo no PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- relatorio-de-testes -->'
          { printf '%s\n' "$marker"; cat reports/resumo.md; printf '\n[Execução e relatórios completos](%s)\n' "$RUN_URL"; } > reports/comentario.md
          id=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"$marker\"))) | .id" | head -n 1)
          if [[ -n "$id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$id" -F body=@reports/comentario.md > /dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -F body=@reports/comentario.md > /dev/null
          fi

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorios-de-teste
          path: |
            reports
            apps/frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Logs do banco em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=100 postgres

      - name: Remover apenas o ambiente de CI
        if: always()
        run: docker compose down -v --remove-orphans
